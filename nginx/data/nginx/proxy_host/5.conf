# ------------------------------------------------------------
# omv.hdom.pl
# ------------------------------------------------------------


server {
  set $forward_scheme http;
  set $server         "192.168.178.98";
  set $port           85;

  listen 80;
listen [::]:80;

listen 443 ssl http2;
listen [::]:443 ssl http2;


  server_name omv.hdom.pl;


  # Custom SSL
  ssl_certificate /data/custom_ssl/npm-23/fullchain.pem;
  ssl_certificate_key /data/custom_ssl/npm-23/privkey.pem;






  # Block Exploits
  include conf.d/include/block-exploits.conf;







    # Force SSL
    include conf.d/include/force-ssl.conf;




proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;


  access_log /data/logs/proxy-host-5_access.log proxy;
  error_log /data/logs/proxy-host-5_error.log warn;







  location / {









    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    

    # Proxy!
    include conf.d/include/proxy.conf;
  }


  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
