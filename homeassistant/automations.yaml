- id: '1794861927283'
  alias: Increase ground floor temp 0.1
  description: ''
  triggers: []
  conditions: []
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.desired_ground_floor_temperature
    data:
      value: '{{ [states(''input_number.desired_ground_floor_temperature'') | float(20.5)
        + 0.1, 22.0] | min }}'
  mode: single
- id: '1794863174339'
  alias: Decrease
  description: ''
  triggers: []
  conditions: []
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.desired_ground_floor_temperature
    data:
      value: '{{ [states(''input_number.desired_ground_floor_temperature'') | float(20.5)
        - 0.1, 19.0] | max }}'
  mode: single
